name: Build macOS arm64 FFmpeg runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config
      - name: Build pinned runtime
        run: bash scripts/build-macos-arm64-runtime.sh "$RUNNER_TEMP/uhdbd-runtime"
      - name: Verify runtime
        run: |
          "$RUNNER_TEMP/uhdbd-runtime/artifact/ffmpeg" -version
          "$RUNNER_TEMP/uhdbd-runtime/artifact/ffmpeg" -hide_banner -loglevel info -f lavfi -i "color=c=black:s=64x64:r=1,format=yuv420p10le" -frames:v 1 -an -c:v libx265 -preset ultrafast -x265-params "log-level=info" -f null - 2>&1 | grep -E "HEVC encoder version[[:space:]]+4\.2"
          otool -l "$RUNNER_TEMP/uhdbd-runtime/artifact/ffmpeg" | grep -A4 LC_BUILD_VERSION
          otool -l "$RUNNER_TEMP/uhdbd-runtime/artifact/ffprobe" | grep -A4 LC_BUILD_VERSION
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon-ffmpeg-8.1.2-x265-4.2
          path: ${{ runner.temp }}/uhdbd-runtime/artifact/*
          if-no-files-found: error
          retention-days: 1
